# Blueprint de Render: backend (Docker) + PostgreSQL.
# En Render: New → Blueprint → elegir este repo. Pide completar FRONTEND_URL.
# El frontend va en Vercel (ver Documentación/07 - Deploy/Deploy.md).

databases:
  - name: sgi-sanjose-db
    plan: free
    databaseName: sgi_sanjose_db
    user: sgi

services:
  - type: web
    name: sgi-sanjose-api
    runtime: docker
    plan: free
    # Rutas relativas a la raíz del repo (así lo define el schema de Render)
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    buildFilter:
      paths:
        - backend/** # un cambio solo en el frontend no redeploya la API
    # "npm run start:render" (backend/package.json): aplica las migraciones commiteadas
    # (nunca genera nuevas), carga el seed idempotente y levanta la API.
    # Va como script de npm porque Render ya ejecuta este comando dentro de una shell:
    # un "sh -c '...'" acá le llega con las comillas literales y falla.
    dockerCommand: npm run start:render
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sgi-sanjose-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true # Render genera una cadena aleatoria: nunca "cambiame" en producción
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: FRONTEND_URL
        sync: false # se completa en el panel: la URL de Vercel (puede ir más de una, separadas por coma)
      # Recordatorios por e-mail (opcional: sin estas, los correos quedan como SIMULADOS)
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CHECKPOINT_DISABLE
        value: "1"
      - key: PRISMA_HIDE_UPDATE_MESSAGE
        value: "1"
